<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Specialty Care Hospital</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #f0f6f9;
            min-height: 100vh;
        }

        /*==========================
        HEADER / NAVBAR - FIXED AT TOP
        ==========================*/
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 9999;
            padding: 12px 0;
            background: transparent;
            transition: all 0.3s ease;
        }

        /* Add padding to body to prevent content from hiding behind header */
        body {
            padding-top: 100px;
        }

        .header-container {
            width: 94%;
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 76px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 2px 20px rgba(0, 40, 80, 0.06);
            transition: all 0.35s ease;
            border: 1px solid rgba(0, 70, 140, 0.06);
        }

        /* Header scrolled effect */
        header.scrolled .header-container {
            background: #ffffff;
            box-shadow: 0 8px 35px rgba(0, 40, 80, 0.10);
            height: 68px;
            border-color: rgba(0, 70, 140, 0.10);
        }

        /*==========================
        LOGO - Left Side
        ==========================*/
        .logo {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .logo img {
            height: 40px;
            display: block;
            transition: all 0.3s ease;
        }

        header.scrolled .logo img {
            height: 36px;
        }

        /*==========================
        DESKTOP NAV - Center (5 links)
        ==========================*/
        .desktop-nav {
            display: flex;
            align-items: center;
            gap: 28px;
            flex: 1;
            justify-content: center;
            margin: 0 20px;
        }

        .desktop-nav a {
            font-size: 15px;
            font-weight: 500;
            color: #1a2a3a;
            text-decoration: none;
            transition: all 0.3s ease;
            position: relative;
            padding: 6px 0;
            cursor: pointer;
            white-space: nowrap;
            letter-spacing: 0.2px;
        }

        .desktop-nav a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 0;
            height: 2.5px;
            background: #0055a4;
            transition: all 0.3s ease;
            border-radius: 2px;
        }

        .desktop-nav a:hover {
            color: #0055a4;
        }

        .desktop-nav a:hover::after,
        .desktop-nav a.active::after {
            width: 100%;
        }

        .desktop-nav a.active {
            color: #0055a4;
            font-weight: 600;
        }

        /*==========================
        RIGHT SIDE - Login & Sign up
        ==========================*/
        .right-side {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-shrink: 0;
        }

        .login-btn {
            font-size: 15px;
            font-weight: 600;
            color: #1a2a3a;
            text-decoration: none;
            transition: all 0.3s ease;
            padding: 8px 14px;
            border-radius: 40px;
            cursor: pointer;
        }

        .login-btn:hover {
            color: #0055a4;
            background: rgba(0, 85, 164, 0.08);
        }

        .signup-btn {
            background: #0055a4;
            color: #ffffff;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 15px;
            text-decoration: none;
            transition: all 0.35s ease;
            border: none;
            cursor: pointer;
            display: inline-block;
        }

        .signup-btn:hover {
            background: #003d7a;
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 85, 164, 0.35);
        }

        /*==========================
        MOBILE HAMBURGER MENU
        ==========================*/
        .menu-btn {
            width: 42px;
            height: 42px;
            background: rgba(0, 85, 164, 0.08);
            border-radius: 10px;
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            border: none;
            flex-shrink: 0;
            transition: all 0.3s ease;
        }

        .menu-btn:hover {
            background: rgba(0, 85, 164, 0.15);
        }

        .menu-btn i {
            color: #1a2a3a;
            font-size: 18px;
        }

        /*==========================
        MOBILE MENU OVERLAY
        ==========================*/
        .mobile-menu-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(0, 0, 0, 0.3);
            z-index: 9998;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .mobile-menu-overlay.open {
            display: block;
            opacity: 1;
        }

        /*==========================
        MOBILE MENU
        ==========================*/
        .mobile-menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 85%;
            max-width: 340px;
            height: 100vh;
            background: #ffffff;
            padding: 28px 20px;
            transition: all 0.4s ease;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            box-shadow: -10px 0 40px rgba(0, 40, 80, 0.08);
            overflow-y: auto;
        }

        .mobile-menu.open {
            right: 0;
        }

        .mobile-menu-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
            padding-bottom: 14px;
            border-bottom: 1px solid #e8edf2;
        }

        .mobile-menu-header .mobile-logo img {
            height: 34px;
            display: block;
        }

        .close-btn {
            font-size: 24px;
            color: #1a2a3a;
            cursor: pointer;
            background: none;
            border: none;
            padding: 4px;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            color: #0055a4;
            transform: rotate(90deg);
        }

        .mobile-nav-links {
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex: 1;
        }

        .mobile-nav-links a {
            font-size: 18px;
            font-weight: 500;
            color: #1a2a3a;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 10px;
            transition: all 0.3s ease;
            cursor: pointer;
            border-left: 3px solid transparent;
        }

        .mobile-nav-links a:hover {
            background: rgba(0, 85, 164, 0.06);
            color: #0055a4;
            border-left-color: #0055a4;
        }

        .mobile-nav-links a.active {
            background: rgba(0, 85, 164, 0.08);
            color: #0055a4;
            font-weight: 600;
            border-left-color: #0055a4;
        }

        .mobile-actions {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 12px;
            padding-top: 14px;
            border-top: 1px solid #e8edf2;
        }

        .mobile-actions .login-mobile {
            text-align: center;
            padding: 10px;
            font-weight: 600;
            font-size: 15px;
            color: #1a2a3a;
            text-decoration: none;
            border-radius: 40px;
            border: 1.5px solid #d5dce4;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .mobile-actions .login-mobile:hover {
            background: rgba(0, 85, 164, 0.06);
            border-color: #0055a4;
            color: #0055a4;
        }

        .mobile-actions .signup-mobile {
            text-align: center;
            padding: 10px;
            font-weight: 600;
            font-size: 15px;
            color: #ffffff;
            text-decoration: none;
            border-radius: 40px;
            background: #0055a4;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .mobile-actions .signup-mobile:hover {
            background: #003d7a;
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 85, 164, 0.35);
        }

        /*==========================
        RESPONSIVE BREAKPOINTS
        ==========================*/
        @media(max-width: 1024px) {
            .desktop-nav {
                gap: 20px;
                margin: 0 16px;
            }
            .desktop-nav a {
                font-size: 14px;
            }
            .right-side {
                gap: 12px;
            }
            .signup-btn {
                padding: 10px 20px;
                font-size: 14px;
            }
        }

        @media(max-width: 868px) {
            .desktop-nav {
                display: none;
            }
            .right-side {
                display: none;
            }
            .menu-btn {
                display: flex;
            }
            .header-container {
                height: 68px;
                padding: 0 16px;
                border-radius: 12px;
            }
            .logo img {
                height: 36px;
            }
            body {
                padding-top: 92px;
            }
        }

        @media(max-width: 480px) {
            header {
                padding: 8px 0;
            }
            .header-container {
                width: 100%;
                border-radius: 0;
                padding: 0 14px;
                height: 60px;
                background: #ffffff;
                box-shadow: 0 2px 12px rgba(0, 40, 80, 0.06);
            }
            .logo img {
                height: 32px;
            }
            .menu-btn {
                width: 36px;
                height: 36px;
            }
            .menu-btn i {
                font-size: 16px;
            }
            .mobile-menu {
                width: 100%;
                max-width: 100%;
                padding: 20px 16px;
            }
            .mobile-menu-header {
                margin-bottom: 20px;
                padding-bottom: 12px;
            }
            .mobile-menu-header .mobile-logo img {
                height: 30px;
            }
            .mobile-nav-links {
                gap: 6px;
            }
            .mobile-nav-links a {
                font-size: 16px;
                padding: 10px 14px;
            }
            .mobile-actions .login-mobile,
            .mobile-actions .signup-mobile {
                padding: 8px;
                font-size: 14px;
            }
            body {
                padding-top: 76px;
            }
        }

        /*==========================
        DEMO CONTENT - To show header works
        ==========================*/
        .demo-content {
            max-width: 1280px;
            width: 94%;
            margin: 40px auto;
            padding: 60px 40px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 2px 20px rgba(0, 40, 80, 0.04);
            text-align: center;
        }

        .demo-content h1 {
            font-size: 2.5rem;
            color: #0a1a2e;
            margin-bottom: 16px;
        }

        .demo-content h1 span {
            color: #0055a4;
        }

        .demo-content p {
            font-size: 1.1rem;
            color: #4a5a6a;
            max-width: 600px;
            margin: 0 auto 20px;
            line-height: 1.6;
        }

        .demo-content .badge {
            display: inline-block;
            background: #0055a4;
            color: #fff;
            padding: 8px 24px;
            border-radius: 40px;
            font-size: 0.9rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .demo-content {
                padding: 40px 20px;
            }
            .demo-content h1 {
                font-size: 1.8rem;
            }
            .demo-content p {
                font-size: 1rem;
            }
        }
    </style>
</head>

<body>

    <!-- ===== HEADER / NAVBAR ===== -->
    <header id="mainHeader">
        <div class="header-container">

            <!-- LOGO - Left -->
            <div class="logo">
                <a href="index.html">
                    <img src="logo-dark 5.webp" alt="Specialty Care Hospital">
                </a>
            </div>

            <!-- DESKTOP NAV - Center (5 links) -->
            <nav class="desktop-nav">
                <a href="index.html">Home</a>
                <a href="specialties.html">Specialties</a>
                <a href="doctors.html">Doctors</a>
                <a href="appointments.html">Appointments</a>
                <a href="contact.html">Contact</a>
            </nav>

            <!-- RIGHT SIDE - Login & Sign up -->
            <div class="right-side">
                <a href="login.html" class="login-btn">Login</a>
                <a href="signup.html" class="signup-btn">Sign up</a>
            </div>

            <!-- MOBILE HAMBURGER -->
            <button class="menu-btn" id="menuBtn">
                <i class="fas fa-bars"></i>
            </button>

        </div>
    </header>

    <!-- ===== MOBILE MENU OVERLAY ===== -->
    <div class="mobile-menu-overlay" id="mobileOverlay"></div>

    <!-- ===== MOBILE MENU ===== -->
    <div class="mobile-menu" id="mobileMenu">
        <div class="mobile-menu-header">
            <a href="index.html" class="mobile-logo">
                <img src="logo-dark 5.webp" alt="Specialty Care Hospital">
            </a>
            <button class="close-btn" id="closeBtn">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="mobile-nav-links">
            <a href="index.html" class="active">Home</a>
            <a href="specialties.html">Specialties</a>
            <a href="doctors.html">Doctors</a>
            <a href="appointments.html">Appointments</a>
            <a href="contact.html">Contact</a>
        </div>

        <div class="mobile-actions">
            <a href="login.html" class="login-mobile">Log in</a>
            <a href="signup.html" class="signup-mobile">Sign up</a>
        </div>
    </div>

    <script>
        // ===========================
        // ELEMENTS
        // ===========================
        const menuBtn = document.getElementById("menuBtn");
        const closeBtn = document.getElementById("closeBtn");
        const mobileMenu = document.getElementById("mobileMenu");
        const mobileOverlay = document.getElementById("mobileOverlay");
        const mobileLinks = mobileMenu.querySelectorAll("a");
        const header = document.getElementById("mainHeader");

        // ===========================
        // OPEN MENU
        // ===========================
        function openMenu() {
            mobileMenu.classList.add("open");
            mobileOverlay.classList.add("open");
            document.body.style.overflow = "hidden";
        }

        menuBtn.addEventListener("click", function(e) {
            e.preventDefault();
            e.stopPropagation();
            openMenu();
        });

        // ===========================
        // CLOSE MENU
        // ===========================
        function closeMenu() {
            mobileMenu.classList.remove("open");
            mobileOverlay.classList.remove("open");
            document.body.style.overflow = "auto";
        }

        closeBtn.addEventListener("click", function(e) {
            e.preventDefault();
            closeMenu();
        });
        mobileOverlay.addEventListener("click", function(e) {
            e.preventDefault();
            closeMenu();
        });

        // ===========================
        // CLOSE WHEN LINK CLICKED
        // ===========================
        mobileLinks.forEach(link => {
            link.addEventListener("click", function(e) {
                e.preventDefault();
                const href = this.getAttribute("href");
                closeMenu();
                setTimeout(() => {
                    window.location.href = href;
                }, 200);
            });
        });

        // ===========================
        // ESC KEY
        // ===========================
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") {
                closeMenu();
            }
        });

        // ===========================
        // SCROLL EFFECT
        // ===========================
        window.addEventListener("scroll", () => {
            if (window.scrollY > 20) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }
        });

        // ===========================
        // ACTIVE PAGE HIGHLIGHTING
        // ===========================
        const desktopLinks = document.querySelectorAll(".desktop-nav a");
        const allMobileLinks = document.querySelectorAll(".mobile-nav-links a");

        function setActiveLink(links, clickedLink) {
            links.forEach(link => link.classList.remove("active"));
            clickedLink.classList.add("active");
        }

        const currentPage = window.location.pathname.split("/").pop() || "index.html";

        desktopLinks.forEach(link => {
            const href = link.getAttribute("href");
            if (href === currentPage) {
                link.classList.add("active");
            }
        });

        allMobileLinks.forEach(link => {
            const href = link.getAttribute("href");
            if (href === currentPage) {
                link.classList.add("active");
            }
        });

        // ===========================
        // REDIRECT FUNCTIONALITY
        // ===========================
        desktopLinks.forEach(link => {
            link.addEventListener("click", function(e) {
                e.preventDefault();
                const href = this.getAttribute("href");
                setActiveLink(desktopLinks, this);
                window.location.href = href;
            });
        });

        allMobileLinks.forEach(link => {
            link.addEventListener("click", function(e) {
                e.preventDefault();
                const href = this.getAttribute("href");
                setActiveLink(allMobileLinks, this);
                closeMenu();
                setTimeout(() => {
                    window.location.href = href;
                }, 200);
            });
        });

        document.querySelector(".login-btn").addEventListener("click", function(e) {
            e.preventDefault();
            window.location.href = this.getAttribute("href");
        });

        document.querySelector(".signup-btn").addEventListener("click", function(e) {
            e.preventDefault();
            window.location.href = this.getAttribute("href");
        });

        document.querySelector(".login-mobile").addEventListener("click", function(e) {
            e.preventDefault();
            closeMenu();
            setTimeout(() => {
                window.location.href = this.getAttribute("href");
            }, 200);
        });

        document.querySelector(".signup-mobile").addEventListener("click", function(e) {
            e.preventDefault();
            closeMenu();
            setTimeout(() => {
                window.location.href = this.getAttribute("href");
            }, 200);
        });

        console.log("✅ Specialty Care Hospital - Professional Header Ready!");
        console.log("🎨 Color: #0055a4 (Medical Blue)");
        console.log("📱 5 Navbar: Home · Specialties · Doctors · Appointments · Contact");
    </script>

</body>

</html>
