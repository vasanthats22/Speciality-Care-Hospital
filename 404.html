<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Specialty Care Hospital - Page Not Found</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        /* ===== FULL PAGE LAYOUT ===== */
        body {
            background: #f0f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        /* ----- ERROR CARD - REDESIGNED ----- */
        .error-page {
            max-width: 1100px;
            width: 100%;
            background: #ffffff;
            padding: 3.5rem 3rem;
            display: flex;
            align-items: center;
            gap: 30px;
            border-radius: 24px;
            box-shadow: 0 8px 40px rgba(0, 40, 80, 0.08);
            border: 1px solid rgba(0, 85, 164, 0.06);
            position: relative;
            overflow: hidden;
        }

        .error-page::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 5px;
            background: linear-gradient(90deg, #0055a4, #0088cc, #0055a4);
            background-size: 200% 100%;
            animation: gradientMove 3s ease-in-out infinite;
        }

        @keyframes gradientMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ===== LEFT COLUMN ===== */
        .error-content {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0.5rem 0;
        }

        /* Top badge */
        .error-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0, 85, 164, 0.08);
            color: #0055a4;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            margin-bottom: 20px;
            width: fit-content;
        }

        .error-badge i {
            font-size: 0.9rem;
        }

        .error-number {
            font-size: 7.5rem;
            font-weight: 900;
            color: #0055a4;
            letter-spacing: -6px;
            line-height: 1;
            margin-bottom: 0.2rem;
            background: linear-gradient(135deg, #0055a4, #0088cc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .error-heading {
            font-size: 2.2rem;
            font-weight: 800;
            color: #0a1a2e;
            margin-bottom: 0.8rem;
        }

        .error-description {
            font-size: 1.05rem;
            line-height: 1.8;
            max-width: 400px;
            color: #4a5a6a;
            margin-bottom: 2rem;
        }

        .error-description i {
            color: #0055a4;
            margin-right: 4px;
        }

        .button-row {
            display: flex;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 0.85rem 2.2rem;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: inherit;
            border: none;
            min-width: 160px;
        }

        .btn-primary {
            background: #0055a4;
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(0, 85, 164, 0.25);
        }

        .btn-primary:hover {
            background: #003d7a;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(0, 85, 164, 0.35);
        }

        .btn-primary i {
            font-size: 1rem;
        }

        .btn-secondary {
            background: #f0f4f9;
            color: #0a1a2e;
            border: 2px solid #e8edf2;
        }

        .btn-secondary:hover {
            background: #ffffff;
            border-color: #0055a4;
            color: #0055a4;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 40, 80, 0.08);
        }

        .btn-secondary i {
            font-size: 1rem;
        }

        /* Help links */
        .help-links {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .help-links a {
            color: #6a7a8a;
            font-size: 0.85rem;
            text-decoration: none;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .help-links a:hover {
            color: #0055a4;
        }

        .help-links a i {
            font-size: 0.8rem;
        }

        /* ===== RIGHT COLUMN ===== */
        .error-illustration {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 320px;
            position: relative;
        }

        /* Decorative circles */
        .error-illustration::before {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0, 85, 164, 0.04) 0%, transparent 70%);
            border-radius: 50%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .error-illustration img {
            width: 100%;
            max-width: 480px;
            height: auto;
            display: block;
            position: relative;
            z-index: 1;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
        }

        /* ============================================================ */
        /*  RESPONSIVE                                                  */
        /* ============================================================ */
        @media (max-width: 992px) {
            .error-page {
                padding: 2.5rem 2rem;
            }

            .error-number {
                font-size: 5.5rem;
                letter-spacing: -4px;
            }

            .error-heading {
                font-size: 1.8rem;
            }

            .error-illustration img {
                max-width: 380px;
            }
        }

        @media (max-width: 768px) {
            body {
                padding: 20px 16px;
            }

            .error-page {
                flex-direction: column-reverse;
                padding: 2rem 1.5rem;
                text-align: center;
                gap: 16px;
                border-radius: 16px;
            }

            .error-content {
                align-items: center;
                padding: 0;
            }

            .error-badge {
                align-self: center;
            }

            .error-description {
                max-width: 340px;
                margin-left: auto;
                margin-right: auto;
            }

            .button-row {
                justify-content: center;
            }

            .help-links {
                justify-content: center;
            }

            .error-number {
                font-size: 4.5rem;
                letter-spacing: -3px;
            }

            .error-heading {
                font-size: 1.6rem;
            }

            .error-description {
                font-size: 0.95rem;
            }

            .error-illustration {
                min-height: 200px;
                width: 100%;
            }

            .error-illustration img {
                max-width: 320px;
            }

            .btn {
                font-size: 0.85rem;
                padding: 0.7rem 1.6rem;
                min-width: 140px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px 10px;
            }

            .error-page {
                padding: 1.5rem 1rem;
                gap: 12px;
                border-radius: 12px;
            }

            .error-number {
                font-size: 3.5rem;
                letter-spacing: -2px;
            }

            .error-heading {
                font-size: 1.3rem;
            }

            .error-description {
                font-size: 0.85rem;
                max-width: 260px;
                margin-bottom: 1.5rem;
            }

            .button-row {
                flex-direction: column;
                align-items: center;
                width: 100%;
            }

            .btn {
                font-size: 0.8rem;
                padding: 0.6rem 1.2rem;
                min-width: 100%;
                width: 100%;
                justify-content: center;
            }

            .error-illustration img {
                max-width: 220px;
            }

            .error-illustration {
                min-height: 150px;
            }

            .help-links {
                flex-direction: column;
                align-items: center;
                gap: 8px;
            }

            .error-badge {
                font-size: 0.7rem;
                padding: 4px 12px;
            }
        }

        @media (max-width: 380px) {
            .error-number {
                font-size: 2.8rem;
            }

            .error-heading {
                font-size: 1.1rem;
            }

            .error-description {
                font-size: 0.78rem;
                max-width: 220px;
            }

            .btn {
                font-size: 0.7rem;
                padding: 0.5rem 1rem;
            }

            .error-illustration img {
                max-width: 180px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 404 ERROR PAGE ===== -->
    <div class="error-page">

        <!-- ===== LEFT COLUMN ===== -->
        <div class="error-content">
            <div class="error-badge">
                <i class="fas fa-exclamation-circle"></i>
                Error 404
            </div>
            <div class="error-number">404</div>
            <h1 class="error-heading">Page Not Found</h1>
            <p class="error-description">
                <i class="fas fa-heartbeat"></i> We can't seem to find the page you're looking for. 
                It might have been moved, deleted, or never existed.
            </p>
            <div class="button-row">
                <a href="index.html" class="btn btn-primary" id="goHomeBtn">
                    <i class="fas fa-home"></i> Go to Homepage
                </a>
                <a href="#" class="btn btn-secondary" id="goBackBtn">
                    <i class="fas fa-arrow-left"></i> Go Back
                </a>
            </div>

            <div class="help-links">
                <a href="index.html"><i class="fas fa-chevron-right"></i> Home</a>
                <a href="specialties.html"><i class="fas fa-chevron-right"></i> Specialties</a>
                <a href="doctors.html"><i class="fas fa-chevron-right"></i> Doctors</a>
                <a href="contact.html"><i class="fas fa-chevron-right"></i> Contact</a>
            </div>
        </div>

        <!-- ===== RIGHT COLUMN ===== -->
        <div class="error-illustration">
            <img src="sp7.webp" alt="404 illustration - Medical" />
        </div>

    </div>

    <script>
        // ===== BUTTON FUNCTIONALITY =====
        document.getElementById('goHomeBtn').addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = 'index.html';
        });

        document.getElementById('goBackBtn').addEventListener('click', function(e) {
            e.preventDefault();
            window.history.back();
        });

        // ===== HELP LINKS NAVIGATION =====
        document.querySelectorAll('.help-links a').forEach(link => {
            link.addEventListener('click', function(e) {
                e.preventDefault();
                const href = this.getAttribute('href');
                window.location.href = href;
            });
        });

        console.log('✅ 404 page ready!');
        console.log('🎨 Medical Blue design - Clean standalone page');
    </script>

</body>
</html>
